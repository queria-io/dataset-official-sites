name: Check

# 公式サイトを開いて data/ を書き換え (tools/check.py)、変わった分を PR にする。マージは人がやる。
# マージすると Sync がデータセットを作り直す。

on:
  schedule:
    # 毎月 1 日 09:00 JST
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: check
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # 約 2,000 サイトを 8 並列で開いて 10 分ほど
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Check sites
        id: check
        run: |
          uv run --no-project --python 3.13 python tools/check.py | tee "${RUNNER_TEMP}/summary.txt"
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/check-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/
          git commit -m "chore: 公式サイトの確認結果を更新する"
          git push -u origin "$branch"
          {
            cat "${RUNNER_TEMP}/summary.txt"
            printf '\nURL の変更は data/official_site_history.csv の差分で確認できます。\n'
            printf '確認できなかった行は url と verified_at を前回のままにしています。\n'
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr create \
            --title "chore: 公式サイトの確認結果を更新する ($(date +%Y-%m-%d))" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
