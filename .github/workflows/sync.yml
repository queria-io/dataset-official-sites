name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 毎月 1 日 09:00 JST。全サイトを開いて確認する
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@4aafe4fe1a8d514011ca7ef5beb0e8a0ea261888
    with:
      dataset_name: official_sites
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
