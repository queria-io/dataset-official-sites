name: "official_sites"
version: "1.0.0"

profile: "official_sites"

model-paths: ["models"]
macro-paths: ["shared/macros", "macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# 本番の Sync が 1 回通ったら、このブロックごと消してよい
on-run-start:
  - "{{ drop_retired_tables() }}"

models:
  official_sites:
    +database: official_sites
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    main:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
