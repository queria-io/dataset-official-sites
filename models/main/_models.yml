version: 2

models:
  - name: official_site
    columns:
      - name: corporate_number
        data_tests: [unique]
      - name: lg_code
        data_tests: [unique]
      - name: name
        data_tests: [not_null]
      - name: organization_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prefecture, municipality, special_ward, designated_city, ward]
      - name: url
        data_tests: [unique]
  - name: official_site_history
