schema: main
name: site_check
title: 公式サイトの確認の記録
description: |-
  公式サイトを開いて確認した記録です。1 行が「ある日にある URL を開いた結果」です。official_site と official_site_history はこの記録から作っています。

  - 毎月の更新で、前回確認できた URL（overrides.csv に URL があればその URL）を開いて追記します。確認できたことが無い団体・機関は、候補の URL をすべて開きます
  - verified は、HTTP 200 でページのタイトルに名前を含んだかどうかです
fields:
  - name: corporate_number
    title: 法人番号
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: lg_code
    title: 全国地方公共団体コード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: name
    title: 名前
  - name: url
    title: 開いた URL
  - name: url_source
    title: URL の出どころ
    description: candidate（候補の一覧）・previous（前回確認できた URL）・override（人が確認して指定した URL）
  - name: checked_at
    title: 開いた日
  - name: final_url
    title: 到達先の URL
    description: リダイレクトの後の URL
  - name: http_status
    title: HTTP ステータス
    description: 接続できなかったときは NULL
  - name: page_title
    title: ページのタイトル
  - name: verified
    title: 確認できたか
