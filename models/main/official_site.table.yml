schema: main
name: official_site
title: 公式サイト
description: |-
  地方公共団体と国の機関の公式サイトの URL です。1 行が 1 つの団体・機関です。

  - 毎月サイトを開いて、HTTP 200 でページのタイトルに団体・機関の名前を含めば、確認できたとします。人が記録した URL は、HTTP 200 で開ければ確認できたとします
  - 確認できなかった月は、前に確認できた URL のまま残します。最後に開いた結果は last_ の列で確認できます
  - URL が見つかっていない団体・機関は url と verified_at が NULL です
  - 人が対象から外した団体・機関は含めません
  - 地方裁判所と家庭裁判所は同じサイトなので、同じ URL です
fields:
  - name: corporate_number
    title: 法人番号
    description: 13 桁。houjin_bangou と結合できる。政令指定都市の区は NULL
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6 桁（検査数字付き）。国の機関は NULL
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: name
    title: 名前
  - name: organization_type
    title: 種類
    description: prefecture（都道府県）・municipality（市町村）・special_ward（東京都の特別区）・designated_city（政令指定都市）・ward（政令指定都市の区）・national_agency（府省庁・委員会・本部など）・court（裁判所）・public_prosecutors_office（検察庁）
  - name: prefecture_name
    title: 都道府県名
    description: 地方公共団体はその都道府県、国の機関は法人番号の所在地の都道府県
  - name: url
    title: 公式サイトの URL
    description: 確認できたときの到達先の URL（リダイレクトの後）
  - name: url_source
    title: URL の出どころ
    description: candidate（候補の一覧から確認した）・redirect（前の URL からリダイレクトされた）・manual（人が確認して記録した）
  - name: recorded_by
    title: 記録した人
    description: url_source が manual のとき
  - name: note
    title: 備考
    description: url_source が manual のとき、記録した理由
  - name: verified_at
    title: 確認日時
    description: url を最後に確認できた日時
  - name: last_checked_at
    title: 最終確認日時
    description: 最後にサイトを開いた日時
  - name: last_http_status
    title: 最後の HTTP ステータス
    description: 接続できなかったときは NULL
  - name: last_page_title
    title: 最後のページのタイトル
