schema: main
name: organization
title: 対象の団体・機関
description: |-
  公式サイトを持たせる対象の一覧です。official_site の行の元です。

  - 地方公共団体は「統計に用いる標準地域コード」の都道府県・市区町村・政令指定都市の区です。郡・支庁と、役場の無い北方領土の 6 村は含めません
  - 国の機関は法人番号の法人種別 101 です。簡易裁判所（東京簡易裁判所を除く）と検察審査会は地方裁判所のサイトの中にあるので含めません
annotations: { queria: { published: false } }
fields:
  - name: corporate_number
    title: 法人番号
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: lg_code
    title: 全国地方公共団体コード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: name
    title: 名前
  - name: organization_type
    title: 種類
  - name: prefecture_name
    title: 都道府県名
